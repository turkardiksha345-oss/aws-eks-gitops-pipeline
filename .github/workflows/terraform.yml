name: Terraform Infrastructure Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action to Execute'
        required: true
        type: choice
        default: 'apply'
        options:
          - 'apply'
          - 'plan'
          - 'destroy'
      confirm_destroy:
        description: 'Required if action is "destroy": Type DESTROY to confirm'
        required: false
        type: string
        default: ''
      auto_approve:
        description: 'Auto-approve Apply / Destroy'
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::755729228993:role/github-actions-ecr-role
  TF_VERSION: '1.5.7'
  TF_WORKING_DIR: './terraform'

permissions:
  id-token: write # Required for AWS OIDC
  contents: read # Required to read repo code
  pull-requests: write # Required for posting PR plan comments

jobs:
  terraform:
    name: Terraform ${{ inputs.action != '' && inputs.action || 'Plan (PR)' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ACCESS_KEY_ID == '' && env.AWS_ROLE_TO_ASSUME || '' }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # ------------------------------------------------------------------------
      # Safety Check for Destroy Action
      # ------------------------------------------------------------------------
      - name: Destroy Safeguard Check
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "::error::Destroy aborted! You must type 'DESTROY' in the confirm_destroy input field to prevent accidental deletion of infrastructure."
            exit 1
          fi
          echo "Safeguard check passed. Proceeding with Terraform Destroy."

      # ------------------------------------------------------------------------
      # Terraform Plan (Runs on PRs or when action is 'plan' or 'apply')
      # ------------------------------------------------------------------------
      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'))
        run: |
          terraform plan -no-color -out=tfplan

      # ------------------------------------------------------------------------
      # Terraform Apply
      # ------------------------------------------------------------------------
      - name: Terraform Apply
        id: apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: |
          if [ "${{ github.event.inputs.auto_approve }}" = "true" ]; then
            terraform apply -input=false -auto-approve tfplan
          else
            terraform apply -input=false tfplan
          fi

      - name: Display Outputs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: |
          echo "=== Terraform Infrastructure Outputs ==="
          terraform output

      # ------------------------------------------------------------------------
      # Terraform Destroy
      # ------------------------------------------------------------------------
      - name: Terraform Destroy
        id: destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          if [ "${{ github.event.inputs.auto_approve }}" = "true" ]; then
            terraform destroy -input=false -auto-approve
          else
            terraform destroy -input=false
          fi
