name: CI/CD Pipeline with DevSecOps

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'chart/**'
      - 'argocd/**'
      - 'docs/**'
      - 'README.md'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: aws-eks-gitops-pipeline
  # Replace with actual IAM Role ARN for GitHub Actions OIDC
  AWS_ROLE_TO_ASSUME: arn:aws:iam::123456789012:role/github-actions-ecr-role 
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: write # Required to commit Helm chart updates

jobs:
  test-and-scan:
    name: Code Quality and SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for SonarCloud analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt flake8
          
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Example SonarCloud SAST integration
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true # Set to true to allow pipeline to continue even if Sonar is not configured by user yet

  build-and-push:
    name: Build, Scan Image, and Push to ECR
    needs: test-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          # Tag as latest as well
          docker tag $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $REGISTRY/$ECR_REPOSITORY:latest

      # DevSecOps: Container Image Scanning with Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1' # Fail pipeline if CRITICAL vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true # Let user see vulnerabilities without failing initially during setup

      - name: Push Docker Image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

  update-manifests:
    name: Update Helm Manifests for GitOps
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm values.yaml
        run: |
          # Use sed to replace the tag in values.yaml with the new image tag
          sed -i "s/tag: .*/tag: \"${{ env.IMAGE_TAG }}\"/g" chart/values.yaml
          
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/values.yaml
          git commit -m "chore: update image tag to ${{ env.IMAGE_TAG }} [skip ci]"
          git push
