name: End-to-End GitOps & Infrastructure Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Pipeline Action to Execute'
        required: true
        type: choice
        default: 'apply-and-deploy'
        options:
          - 'apply-and-deploy'
          - 'app-only'
          - 'infra-only'
          - 'plan'
          - 'destroy'
      confirm_destroy:
        description: 'Required if action is "destroy": Type DESTROY to confirm'
        required: false
        type: string
        default: ''
      auto_approve:
        description: 'Auto-approve Terraform Apply / Destroy'
        required: true
        type: boolean
        default: true

  push:
    branches:
      - main
    paths-ignore:
      - 'chart/**'
      - 'argocd/**'
      - 'docs/**'
      - 'README.md'

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: eks-cluster-app
  EKS_CLUSTER_NAME: my-kubernetes-cluster
  ARGOCD_APP_NAME: aws-eks-gitops-pipeline
  AWS_ROLE_TO_ASSUME: arn:aws:iam::755729228993:role/github-actions-ecr-role
  ALB_CONTROLLER_ROLE_ARN: arn:aws:iam::755729228993:role/AmazonEKSLoadBalancerControllerRole
  TF_VERSION: '1.5.7'
  TF_WORKING_DIR: './terraform'
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: write # Required to commit Helm chart updates

jobs:
  # ============================================================================
  # 1. TERRAFORM INFRASTRUCTURE (Provision, Plan, or Destroy)
  # ============================================================================
  terraform-infrastructure:
    name: Terraform Infrastructure (${{ inputs.action != '' && inputs.action || 'Apply on Push' }})
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'workflow_dispatch' && 
        (inputs.action == 'apply-and-deploy' || 
         inputs.action == 'infra-only' || 
         inputs.action == 'plan' || 
         inputs.action == 'destroy'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ACCESS_KEY_ID == '' && env.AWS_ROLE_TO_ASSUME || '' }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      # Safety guard for destroy
      - name: Destroy Safeguard Check
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "::error::Destroy aborted! You must type 'DESTROY' in confirm_destroy to tear down infrastructure."
            exit 1
          fi
          echo "Safeguard passed. Proceeding with Terraform Destroy."

      # Destroy Action
      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve -input=false

      # Plan Action
      - name: Terraform Plan
        if: |
          github.event_name == 'push' || 
          (github.event_name == 'workflow_dispatch' && 
            (inputs.action == 'plan' || 
             inputs.action == 'apply-and-deploy' || 
             inputs.action == 'infra-only'))
        run: |
          terraform plan -no-color -out=tfplan

      # Apply Action
      - name: Terraform Apply
        if: |
          github.event_name == 'push' || 
          (github.event_name == 'workflow_dispatch' && 
            (inputs.action == 'apply-and-deploy' || 
             inputs.action == 'infra-only'))
        run: |
          terraform apply -input=false -auto-approve tfplan

      - name: Display Terraform Outputs
        if: |
          github.event_name == 'push' || 
          (github.event_name == 'workflow_dispatch' && 
            (inputs.action == 'apply-and-deploy' || 
             inputs.action == 'infra-only'))
        run: |
          echo "=== Terraform Infrastructure Outputs ==="
          terraform output

  # ============================================================================
  # 2. CODE QUALITY AND SAST SCANNING
  # ============================================================================
  test-and-scan:
    name: Code Quality and SAST
    if: |
      always() && 
      (github.event_name == 'push' || 
        (github.event_name == 'workflow_dispatch' && 
          inputs.action != 'destroy' && 
          inputs.action != 'plan' && 
          inputs.action != 'infra-only'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt flake8

      - name: Lint with flake8
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # ============================================================================
  # 3. BUILD, SCAN, AND PUSH DOCKER IMAGE TO ECR
  # ============================================================================
  build-and-push:
    name: Build, Scan Image, and Push to ECR
    needs: [terraform-infrastructure, test-and-scan]
    if: |
      always() && 
      !cancelled() && 
      !contains(needs.*.result, 'failure') && 
      (github.event_name == 'push' || 
        (github.event_name == 'workflow_dispatch' && 
          (inputs.action == 'apply-and-deploy' || inputs.action == 'app-only')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ACCESS_KEY_ID == '' && env.AWS_ROLE_TO_ASSUME || '' }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $REGISTRY/$ECR_REPOSITORY:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

  # ============================================================================
  # 4. UPDATE GITOPS MANIFESTS (Helm chart)
  # ============================================================================
  update-manifests:
    name: Update Helm Manifests for GitOps
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm values.yaml
        run: |
          sed -i "s/tag: .*/tag: \"${{ env.IMAGE_TAG }}\"/g" chart/values.yaml

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/values.yaml
          git commit -m "chore: update image tag to ${{ env.IMAGE_TAG }} [skip ci]"
          git push

  # ============================================================================
  # 5. DEPLOY TO AMAZON EKS & ARGO CD SYNC
  # ============================================================================
  deploy-to-eks:
    name: Continuous Deployment (CD) & EKS Sync
    needs: update-manifests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ACCESS_KEY_ID == '' && env.AWS_ROLE_TO_ASSUME || '' }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Check Cluster API Reachability & Manage Deployment
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          echo "Testing connectivity to EKS API server..."
          if kubectl version --request-timeout='10s' > /dev/null 2>&1; then
            echo "✅ EKS API server is directly reachable from this runner."
            
            echo "Installing Helm CLI..."
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

            echo "Applying AWS Load Balancer Controller CRDs..."
            kubectl apply -k "github.com/aws/eks-charts/stable/aws-load-balancer-controller//crds?ref=master" 

            echo "Adding EKS Helm Chart repository..."
            helm repo add eks https://aws.github.io/eks-charts
            helm repo update

            echo "Installing/Upgrading AWS Load Balancer Controller..."
            ALB_ROLE_ARN=$(aws iam get-role --role-name "${{ env.EKS_CLUSTER_NAME }}-AmazonEKSLoadBalancerControllerRole" --query 'Role.Arn' --output text 2>/dev/null || echo "${{ env.ALB_CONTROLLER_ROLE_ARN }}")
            helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
              -n kube-system \
              --set clusterName=${{ env.EKS_CLUSTER_NAME }} \
              --set serviceAccount.create=true \
              --set serviceAccount.name=aws-load-balancer-controller \
              --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${ALB_ROLE_ARN} \
              --wait --timeout=180s

            if [ -n "$ARGOCD_SERVER" ] && [ -n "$ARGOCD_AUTH_TOKEN" ]; then
              echo "Installing ArgoCD CLI..."
              curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
              chmod +x /usr/local/bin/argocd
              
              echo "Triggering automated sync on ArgoCD..."
              argocd app sync ${{ env.ARGOCD_APP_NAME }} --auth-token "$ARGOCD_AUTH_TOKEN" --server "$ARGOCD_SERVER" --insecure
              
              echo "Waiting for ArgoCD application to reach Healthy state..."
              argocd app wait ${{ env.ARGOCD_APP_NAME }} --sync --health --timeout 300 --auth-token "$ARGOCD_AUTH_TOKEN" --server "$ARGOCD_SERVER" --insecure
            else
              echo "Watching deployment rollout status directly on EKS..."
              kubectl rollout status deployment/${{ env.ARGOCD_APP_NAME }} -n hello-world-app --timeout=180s || true
            fi

            echo "============================================================"
            echo "🚀 ACTIVE KUBERNETES PODS & STATUS"
            echo "============================================================"
            kubectl get pods -n hello-world-app -o wide
            echo ""
            echo "============================================================"
            echo "📊 DEPLOYMENT ROLLOUT STATUS"
            echo "============================================================"
            kubectl get deployment -n hello-world-app -o wide
            echo ""
            echo "============================================================"
            echo "🌐 ACTIVE INGRESS & APPLICATION URLS"
            echo "============================================================"
            kubectl get ingress -n hello-world-app
            echo ""

            # Post deployment summary directly to GitHub Actions UI
            echo "## 🚀 Deployment & Pods Status Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **EKS Cluster** | \`${{ env.EKS_CLUSTER_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **AWS Region** | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Image Tag** | \`${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Application URL** | [https://cdec-engineer.store](https://cdec-engineer.store) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🟢 Active Pods" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            kubectl get pods -n hello-world-app -o wide >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### 🌐 Ingress Endpoints" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            kubectl get ingress -n hello-world-app >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "🔒 EKS Cluster API is in Private Mode (no public endpoint)."
            echo "✅ Helm chart manifests were successfully updated & pushed to Git repository."
            echo "🚀 In-cluster Argo CD will pull and reconcile the deployment inside the VPC automatically."

            echo "## 🚀 GitOps Deployment Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ✅ Helm Chart Updated with Image \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Mode**: 🔒 Private EKS Cluster (GitOps Reconciliation)" >> $GITHUB_STEP_SUMMARY
            echo "- **Application URL**: [https://cdec-engineer.store](https://cdec-engineer.store)" >> $GITHUB_STEP_SUMMARY
          fi
